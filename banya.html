<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Лазня — расчёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--text:#f6e8d2;--muted:#c2a27c;--gold:#f0c879;--gold2:#e8a44c;--acc:#d9711f;--line:rgba(232,170,90,.45);--ok:#a8d27a;--bad:#ff7a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);font-family:Bitter,Georgia,serif;font-size:15px;background:#120a05}
body{padding:10px 12px calc(30px + env(safe-area-inset-bottom));min-height:100vh;position:relative}
/* дерево, фонарь, окно, виньетка */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(45% 30% at 92% 10%,rgba(255,160,60,.45),transparent 70%),
 radial-gradient(35% 45% at 0% 22%,rgba(120,160,200,.16),transparent 70%),
 radial-gradient(60% 40% at 15% 95%,rgba(255,120,40,.22),transparent 70%),
 radial-gradient(140% 100% at 50% 45%,transparent 35%,rgba(0,0,0,.75)),
 repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 96px),
 repeating-linear-gradient(0deg,rgba(255,200,140,.035) 0 1px,transparent 1px 6px),
 repeating-linear-gradient(90deg,rgba(255,190,120,.03) 0 1px,transparent 1px 13px),
 linear-gradient(180deg,#2b170a,#1a0e06 50%,#100804)}
.wrap{max-width:560px;margin:0 auto}
/* шапка как на прайсе */
.hero{text-align:center;padding:6px 0 4px}
.steamico{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold)}
.steamico::before,.steamico::after{content:"";height:1px;flex:1;max-width:120px;background:linear-gradient(90deg,transparent,var(--gold))}
.steamico::after{background:linear-gradient(90deg,var(--gold),transparent)}
.steamico svg{width:30px;height:30px;filter:drop-shadow(0 0 6px rgba(255,170,70,.6))}
h1{margin:0;font-weight:900;font-size:64px;line-height:1;letter-spacing:.03em;
 background:linear-gradient(180deg,#ffe1a3 0%,#f3a548 38%,#c8641e 62%,#7b330f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #3a1505) drop-shadow(0 0 18px rgba(255,140,40,.35))}
.ban{position:relative;display:block;width:fit-content;max-width:100%;margin:12px auto 12px;padding:9px 28px 10px;text-align:center;
 font-weight:800;font-size:19px;color:#fff3df;text-shadow:0 2px 2px rgba(0,0,0,.65);
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 9px),
 linear-gradient(90deg,rgba(110,45,12,0) 0%,#7a3410 5%,#a84c19 18%,#bd5c20 50%,#a84c19 82%,#7a3410 95%,rgba(110,45,12,0) 100%);
 clip-path:polygon(1% 22%,7% 6%,28% 11%,52% 0,76% 9%,96% 3%,100% 42%,98% 86%,86% 100%,62% 91%,36% 100%,12% 93%,0 78%)}
.ban.sm{font-size:16px;padding:7px 22px 8px}
.date{color:var(--muted);font-size:13px;margin-top:-4px}
.sec{background:rgba(12,6,2,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:14px;padding:4px 14px 12px;margin:4px 0 14px;
 box-shadow:inset 0 1px 0 rgba(240,200,121,.18),inset 0 -1px 0 rgba(240,200,121,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 0;
 background:linear-gradient(90deg,transparent,var(--line),transparent) bottom/100% 1px no-repeat}
.row:last-child{background:none}
.ico{width:26px;height:26px;color:var(--gold);flex-shrink:0;filter:drop-shadow(0 0 4px rgba(255,170,70,.4))}
.lbl{flex:1;min-width:0;font-weight:700;font-size:16px}
.lbl small{display:block;color:var(--muted);font-size:12px;font-weight:500;font-style:italic;margin-top:2px}
.num{font-family:Oswald,sans-serif;font-weight:700;color:var(--gold);text-shadow:0 0 12px rgba(255,150,50,.35);white-space:nowrap}
.num em{font-style:normal;font-weight:500;font-size:.62em;color:var(--text);margin-left:3px}
.step{display:flex;align-items:center;border:1px solid rgba(240,200,121,.5);border-radius:10px;overflow:hidden;flex-shrink:0;background:rgba(0,0,0,.35)}
.step button{width:36px;height:34px;border:0;background:linear-gradient(180deg,#5a2a0e,#3a1a08);color:var(--gold);font-size:20px;font-family:Oswald,sans-serif;line-height:1}
.step span{min-width:38px;text-align:center;font-family:Oswald,sans-serif;font-weight:700;font-size:17px;color:var(--gold)}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:#3a2212;border:1px solid rgba(240,200,121,.4);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8a6f55;transition:.2s}
.sw.on{background:linear-gradient(180deg,#e8913a,#b8561a)}.sw.on::after{left:23px;background:#fff2da}
select,input{font-family:Oswald,sans-serif;font-size:16px;color:var(--gold);background:rgba(0,0,0,.4);border:1px solid rgba(240,200,121,.45);border-radius:10px;padding:7px 10px;outline:none}
input::placeholder{color:#8a6a4a;font-family:Bitter,serif;font-size:14px}
select:focus,input:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.chip{font-family:Bitter,serif;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid rgba(240,200,121,.35);background:rgba(0,0,0,.35);color:var(--muted);font-size:14px}
.chip.on{background:linear-gradient(180deg,#c9661f,#8f3f12);color:#fff3df;border-color:#f0a24a;box-shadow:0 0 12px rgba(255,140,40,.35)}
.add{display:flex;gap:8px;padding:4px 0 8px}
.add input{flex:1;min-width:0;font-family:Bitter,serif;color:var(--text)}
.btn{font-family:Bitter,serif;font-size:15px;font-weight:800;border-radius:10px;border:1px solid rgba(240,200,121,.5);background:linear-gradient(180deg,#5a2a0e,#3a1a08);color:var(--gold);padding:10px 14px}
.btn.pri{background:linear-gradient(180deg,#f0a24a,#c0601c);color:#2a1003;border-color:#f6c06a;box-shadow:0 0 16px rgba(255,140,40,.35)}
.btn.ghost{background:rgba(0,0,0,.3);color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:12px}.btns .btn{flex:1}
.hint{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0}
.person{border-radius:12px;padding:10px;margin:8px 0;background:rgba(0,0,0,.35);border:1px solid rgba(240,200,121,.22)}
.phead{display:flex;align-items:center;gap:8px}
.pname{font-weight:800;flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-family:Bitter,serif;font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;border:1px solid rgba(240,200,121,.3);background:transparent;color:var(--muted)}
.mini.on{border-color:var(--gold);color:var(--gold)}
.steam{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:6px 8px;border-radius:10px;background:rgba(60,80,30,.18);border:1px solid rgba(140,180,90,.25)}
.steam.on{background:rgba(80,110,40,.35);border-color:rgba(160,210,110,.6)}
.steam .t{font-size:14px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px}
.steam .t svg{width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.pill b{padding:7px 9px;font-weight:600}
.pill.has{border-style:solid;border-color:var(--gold2);color:var(--text);background:rgba(160,70,20,.35)}
.pill i{font-style:normal;padding:7px 10px;border-left:1px solid rgba(240,200,121,.3);color:var(--bad);font-weight:800}
.info{font-size:13px;color:var(--text);padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.35);margin-top:8px;border-left:3px solid var(--gold2)}
.info b{font-family:Oswald,sans-serif;color:var(--gold);font-size:15px}
.info.warn{border-left-color:var(--bad)}
.tips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 2px;align-items:center}
.tips .chip{padding:7px 11px;font-family:Oswald,sans-serif;font-weight:600;font-size:15px}
.tips input{width:96px;text-align:right}
.hero2{text-align:center;padding:6px 0 2px}
.hero2 .cap{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero2 .num{font-size:54px;line-height:1.05}
.hero2 .sub{font-size:13px;color:var(--muted);font-style:italic}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(90deg,transparent,var(--line),transparent) bottom/100% 1px no-repeat}
.rrow .n{font-weight:800;font-size:16px}
.rrow .d{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
.rrow .num{font-size:24px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:2px;font-weight:800}
.tot .num{font-size:22px}
.bath{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-top:4px}
details summary{cursor:pointer;list-style:none;text-align:center}
details summary::-webkit-details-marker{display:none}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;background:linear-gradient(90deg,transparent,var(--line),transparent) bottom/100% 1px no-repeat}
.pr span{font-size:14px;font-weight:600}
.pr input{width:92px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:linear-gradient(180deg,#f6c66e,#e8913a);color:#2a1003;padding:10px 18px;border-radius:10px;font-weight:800;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:#9a7a58;font-family:Oswald,sans-serif;font-size:11px;margin-top:16px;letter-spacing:.2em}
.foot::before{content:"";display:block;height:1px;margin:0 auto 10px;max-width:300px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.plist{padding:4px 0}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:52px;background:linear-gradient(90deg,transparent,var(--line),transparent) bottom/100% 1px no-repeat}
.prow:last-child{background:none}
.pchk{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(240,200,121,.5);background:rgba(0,0,0,.35);color:transparent;font-size:18px;font-weight:900;flex-shrink:0;line-height:1;padding:0}
.prow.on .pchk{background:linear-gradient(180deg,#e8913a,#b8561a);border-color:#f6c06a;color:#fff3df}
.prow .pname{flex:1;font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.off .pname{color:#7f6448;font-weight:600}
.steamchk{display:flex;align-items:center;gap:6px;font-family:Bitter,serif;font-weight:700;font-size:14px;padding:7px 11px;border-radius:9px;border:1px solid rgba(140,180,90,.35);background:rgba(60,80,30,.15);color:#8fa877;flex-shrink:0}
.steamchk .box{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.steamchk.on{background:rgba(90,125,45,.5);border-color:rgba(170,220,120,.8);color:#d6f0b8}
.steamchk.on .box{background:#a8d27a;border-color:#a8d27a;color:#1d2a10}
.x{background:none;border:0;color:#7f6448;font-size:16px;padding:6px 4px;flex-shrink:0}
.sumrow{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.sumrow input{flex:1;min-width:0;font-size:22px;text-align:right;padding:10px 12px}
.sumrow .cur{font-family:Oswald,sans-serif;color:var(--muted);font-size:16px}
.bline{display:flex;align-items:center;gap:8px;padding:4px 0 4px 32px}
.bline .step button{width:32px;height:32px}
.bline .step span{min-width:30px}
.bline .mul{color:var(--muted);font-family:Oswald,sans-serif;font-size:15px}
.bline input{width:78px;text-align:right;font-size:16px;padding:6px 8px}
.bline .cur{font-family:Oswald,sans-serif;color:var(--muted);font-size:13px}
.bline .x{margin-left:auto}
.badd{margin:2px 0 4px 32px;background:none;border:1px dashed rgba(240,200,121,.35);color:var(--muted);font-family:Bitter,serif;font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px}
.btot{font-family:Oswald,sans-serif;font-weight:700;color:var(--gold);font-size:18px;white-space:nowrap}
.btot em{font-style:normal;font-weight:500;font-size:.7em;color:var(--muted);margin-left:2px}
.ename{flex:1;min-width:0;font-family:Bitter,serif!important;color:var(--text)!important;font-weight:700;font-size:16px!important;padding:6px 9px!important}
.esave{background:linear-gradient(180deg,#e8913a,#b8561a);border:1px solid #f6c06a;color:#fff3df;border-radius:8px;font-weight:900;width:34px;height:32px;flex-shrink:0}
.edel{background:rgba(120,30,10,.35);border:1px solid rgba(255,122,85,.5);color:var(--bad);border-radius:8px;font-family:Bitter,serif;font-size:12px;font-weight:700;padding:0 9px;height:32px;flex-shrink:0}
.pedit{background:none;border:0;color:#9a7a58;font-size:16px;padding:6px 4px;flex-shrink:0}
.nrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.nrow .idx{width:20px;text-align:right;font-family:Oswald,sans-serif;color:#7f6448;font-size:14px;flex-shrink:0}
.nrow input{flex:1;min-width:0;font-family:Bitter,serif;color:var(--text);font-weight:700;font-size:16px;padding:7px 10px}
.nrow input::placeholder{color:#8a6a4a;font-weight:600}
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;background:linear-gradient(90deg,transparent,var(--line),transparent) bottom/100% 1px no-repeat}
.grp .n{font-weight:800;font-size:16px}
.grp .d{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
.grp .num{font-size:22px}
/* компакт */

<body>
<div class="wrap">

    <h1>ЛАЗНЯ</h1>
        <div class="ban">Скидываемся по-честному!</div>

<script>
(function(){
var TG=window.Telegram&&window.Telegram.WebApp;
var inTg=!!(TG&&TG.platform&&TG.platform!=='unknown');
var hasCloud=inTg&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9');
var KEY='banya_v5',OLDS=['banya_v3','banya_v2'];

var I={
 clock:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
 man:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3.2" fill="currentColor"/><path d="M5 21c0-5 3-8 7-8s7 3 7 8z" fill="currentColor"/></svg>',
 group:'<svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="7" r="2.8" fill="currentColor"/><circle cx="16" cy="7" r="2.8" fill="currentColor"/><path d="M2 20c0-4 2.6-6.5 6-6.5s6 2.5 6 6.5zM10.5 20c.2-2.6-.5-4.6-1.7-6 .9-.3 1.9-.5 3.2-.5h4c3.4 0 6 2.5 6 6.5z" fill="currentColor"/></svg>',
 leaf:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z" fill="currentColor" opacity=".9"/><path d="M4 20L15 9M9 15h4M11 13V9" stroke="#2a1205" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
 coin:'<svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="3" fill="currentColor"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};

function defaults(){return {v:5,ts:0,hours:2,count:4,names:[],steamed:[],prices:{base:1500,baseMax:5,perHead:300},
 bl:[{id:'b1',q:0,p:0}],tip:0,sasha:{on:true,tip:0}}}
var state=defaults();

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fh(h){return String(h).replace('.',',')}
function uid(){return Math.random().toString(36).slice(2,9)}
function hap(){try{if(inTg)TG.HapticFeedback.selectionChanged()}catch(e){}}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1800)}
function nm(i){var v=(state.names[i]||'').trim();return v||('Участник '+(i+1))}

/* ---------- хранение ---------- */
function save(){clearTimeout(save.t);save.t=setTimeout(function(){
 state.ts=Date.now();var s=JSON.stringify(state);
 try{localStorage.setItem(KEY,s)}catch(e){}
 if(hasCloud&&s.length<4000){try{TG.CloudStorage.setItem(KEY,s,function(){})}catch(e){}}
},300)}
function merge(o){if(!o||typeof o!=='object')return;var d=defaults();
 var names=[],steamed=[],count=d.count;
 if(Array.isArray(o.names)){names=o.names.map(String);steamed=Array.isArray(o.steamed)?o.steamed.map(Boolean):[];count=+o.count||d.count}
 else if(Array.isArray(o.people)){var pr=o.people.filter(function(p){return p.present});var src=pr.length?pr:o.people;
  names=src.map(function(p){return String(p.name||'')});steamed=src.map(function(p){return !!(p.steamed||p.steam)});count=src.length||d.count}
 var tip=typeof o.tip==='number'?o.tip:(o.tip&&o.tip.mode==='amt'?+o.tip.value||0:0);
 state={v:5,ts:o.ts||0,hours:o.hours||d.hours,count:Math.max(1,Math.min(30,count)),names:names,steamed:steamed,prices:Object.assign(d.prices,o.prices||{}),
  bl:(Array.isArray(o.bl)&&o.bl.length)?o.bl.map(function(x){return {id:x.id||uid(),q:+x.q||0,p:+x.p||0}}):[{id:'b1',q:0,p:0}],
  tip:tip,sasha:Object.assign(d.sasha,o.sasha||{})}}
function load(cb){
 try{var s=localStorage.getItem(KEY);if(!s)for(var i=0;i<OLDS.length&&!s;i++)s=localStorage.getItem(OLDS[i]);if(s)merge(JSON.parse(s))}catch(e){}
 if(!hasCloud){cb();return}
 try{TG.CloudStorage.getItems([KEY].concat(OLDS),function(err,vals){if(!err&&vals){var v=vals[KEY]||vals[OLDS[0]]||vals[OLDS[1]];if(v){try{var o=JSON.parse(v);if((o.ts||0)>(state.ts||0))merge(o)}catch(e){}}}cb()})}catch(e){cb()}
}

/* ---------- расчёт ---------- */
function calc(){
 var n=Math.max(1,+state.count||1),sOn=!!state.sasha.on;
 var heads=n+(sOn?1:0);
 var H=+state.hours||0,pr=state.prices,rentTotal=0,share=0,mode='';
 if(H>0){if(heads<=pr.baseMax){rentTotal=pr.base*H;mode='flat'}else{rentTotal=pr.perHead*heads*H;mode='head'}share=rentTotal/heads}
 var bsum=0;state.bl.forEach(function(x){bsum+=(+x.q||0)*(+x.p||0)});
 var broomsTotal=bsum,broomEach=bsum/n;
 var staffTip=+state.tip||0,tipEach=staffTip/n;
 var sashaRent=sOn?share:0,sashaTip=0,pool=sashaRent+sashaTip;
 var idx=[];for(var i=0;i<n;i++)idx.push(i);
 var steamers=sOn?idx.filter(function(i){return !!state.steamed[i]}):[];
 var rest=idx.filter(function(i){return steamers.indexOf(i)<0});
 var fallback=sOn&&pool>0&&!steamers.length;
 var poolEach=pool>0?(steamers.length?pool/steamers.length:pool/n):0;
 var up=function(x){return x>0?Math.ceil(x-1e-9):0};
 var base=share+broomEach+tipEach;
 var payRest=up(base+(fallback?poolEach:0)), paySteam=up(base+poolEach);
 var collected=steamers.length*paySteam+rest.length*payRest;
 return {n:n,sOn:sOn,heads:heads,H:H,rentTotal:rentTotal,share:share,mode:mode,broomsTotal:broomsTotal,broomEach:broomEach,staffTip:staffTip,tipEach:tipEach,
  sashaRent:sashaRent,sashaTip:sashaTip,pool:pool,poolEach:poolEach,steamers:steamers,rest:rest,fallback:fallback,
  payRest:payRest,paySteam:paySteam,bath:rentTotal+broomsTotal+staffTip,collected:collected};
}
function formula(c){
 if(c.mode==='flat')return 'до '+state.prices.baseMax+' чел.: '+fmt(state.prices.base)+' × '+fh(c.H)+' ч = '+fmt(c.rentTotal);
 return c.heads+' чел. × '+fmt(state.prices.perHead)+' × '+fh(c.H)+' ч = '+fmt(c.rentTotal)}
function names(list){return list.map(function(i){return esc(nm(i))}).join(', ')}

/* ---------- отрисовка ---------- */
function stepper(act,val){return '<div class="step"><button data-act="'+act+'-">−</button><span>'+val+'</span><button data-act="'+act+'+">+</button></div>'}
function renderControls(){
 var s=state,h='';
 h+='<div class="sec">'+
  '<div class="row">'+I.clock+'<div class="lbl">Часов в бане</div>'+stepper('h',fh(s.hours))+'</div>'+
  '<div class="row">'+I.group+'<div class="lbl">Участников<small>без Саши</small></div>'+stepper('n',s.count)+'</div>'+
  '<div class="row">'+I.man+'<div class="lbl">Банщик Саша с нами<small>'+(s.sasha.on?'место Саши — на тех, кого парил, чаевые — каждый от души':'без Саши — всем поровну')+'</small></div><button class="sw'+(s.sasha.on?' on':'')+'" data-act="sasha"></button></div>'+
  '</div>';
 if(s.sasha.on){
  h+='<div class="ban">Кого парил Саша</div><div class="sec"><div class="plist">';
  for(var i=0;i<s.count;i++){var st=!!s.steamed[i];
   h+='<div class="nrow"><span class="idx">'+(i+1)+'</span><input data-name="'+i+'" value="'+esc(s.names[i]||'')+'" placeholder="Участник '+(i+1)+'" maxlength="24" enterkeyhint="next" autocomplete="off">'+
    '<button class="steamchk'+(st?' on':'')+'" data-act="steam" data-i="'+i+'"><span class="box">'+(st?'✓':'')+'</span>парил</button></div>';
  }
  h+='</div></div>';
 }
 function money(id,ico,label,val){return '<div class="row money">'+ico+'<div class="lbl">'+label+'</div><input id="'+id+'" type="number" inputmode="numeric" min="0" step="10" placeholder="0" value="'+(val||'')+'"><span class="cur">грн</span></div>'}
 h+='<div class="ban">Веники и чаевые</div><div class="sec">'+
  '<div class="row" style="background:none;padding-bottom:0">'+I.leaf+'<div class="lbl">Веники<small>штук × цена, поровну на всех</small></div><span class="btot" id="btot"></span></div>'+
  s.bl.map(function(x){return '<div class="bline"><div class="step"><button data-act="bq-" data-id="'+x.id+'">−</button><span>'+(x.q||0)+'</span><button data-act="bq+" data-id="'+x.id+'">+</button></div><span class="mul">×</span><input data-bp="'+x.id+'" type="number" inputmode="numeric" min="0" placeholder="цена" value="'+(x.p||'')+'"><span class="cur">грн</span>'+(s.bl.length>1?'<button class="x" data-act="bdel" data-id="'+x.id+'">✕</button>':'')+'</div>'}).join('')+
  '<button class="badd" data-act="badd">+ другая цена</button>'+
  '<div style="height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin-top:4px"></div>'+
  money('tipAmt',I.coin,'Чаевые бане<small>поровну на всех</small>',s.tip)+
  (s.sasha.on?'<div class="row">'+I.man+'<div class="lbl">Чаевые Саше<small>каждый отдельно, от души</small></div></div>':'')+
  '<div class="mhint" id="moneyInfo"></div></div>';
 $('#controls').innerHTML=h;
}
function renderPrices(){var p=state.prices,h='';
 h+='<div class="pr"><span>Аренда до N чел., грн/час</span><input data-cfg="base" type="number" inputmode="numeric" value="'+p.base+'"></div>';
 h+='<div class="pr"><span>N — порог людей</span><input data-cfg="baseMax" type="number" inputmode="numeric" value="'+p.baseMax+'"></div>';
 h+='<div class="pr"><span>Больше N — с человека, грн/час</span><input data-cfg="perHead" type="number" inputmode="numeric" value="'+p.perHead+'"></div>';
 h+='<div class="btns"><button class="btn ghost" data-act="resetprices">Вернуть цены из прайса</button></div>';
 $('#prices').innerHTML=h}

function renderResult(){
 var c=calc(),h='';
 var rb=$('#resBan');if(rb)rb.textContent=c.sOn?'Кто сколько платит':'С каждого';
 var bt=$('#btot');if(bt)bt.innerHTML=c.broomsTotal?'= '+fmt(c.broomsTotal)+'<em>грн</em>':'';
 var mi=$('#moneyInfo');
 if(mi){var t=[];
  if(c.broomsTotal)t.push('веники по <b>'+fmt(c.broomEach)+'</b>');
  if(c.staffTip)t.push('чаевые бане по <b>'+fmt(c.tipEach)+'</b>');
  mi.innerHTML=t.length?'С каждого: '+t.join(' · '):'Впиши суммы — разделю сам.'}
 var split=c.sOn&&c.steamers.length&&c.pool>0;
 if(!c.sOn)h+='<div class="hero2"><div class="cap">'+(split?'с остальных':'с каждого')+'</div><div class="num">'+fmt(c.payRest)+'<em>грн.</em></div>'+
  '<div class="sub">аренда '+fmt(c.share)+(c.broomEach?' + веники '+fmt(c.broomEach):'')+(c.tipEach?' + чаевые '+fmt(c.tipEach):'')+(c.fallback?' + доля Саши '+fmt(c.poolEach):'')+'</div></div>';
 if(c.sOn&&c.pool>0){
  var parts=['место '+fmt(c.sashaRent)];if(c.sashaTip)parts.push('чаевые '+fmt(c.sashaTip));
  if(c.fallback){h+='<div class="info warn">Отметь, кого Саша парил — пока его место (<b>'+fmt(c.pool)+'</b>) делится на всех.</div>';
   h+='<div class="grp"><div><div class="n">Все · '+c.n+'</div><div class="d">поровну, пока нет галочек</div></div><div class="num">'+fmt(c.payRest)+'<em>грн.</em></div></div>';}
  else{
   h+='<div class="info">Место Саши <b>'+fmt(c.pool)+'</b> → по <b>'+fmt(c.poolEach)+'</b> с попаренных</div>';
   h+='<div class="grp"><div><div class="n">🌿 Парились · '+c.steamers.length+'</div><div class="d">'+names(c.steamers)+'</div></div><div class="num">'+fmt(c.paySteam)+'<em>грн.</em></div></div>';
   if(c.rest.length)h+='<div class="grp"><div><div class="n">Остальные · '+c.rest.length+'</div><div class="d">'+names(c.rest)+'</div></div><div class="num">'+fmt(c.payRest)+'<em>грн.</em></div></div>';
  }
 }
 if(c.sOn)h+='<div class="info">💛 Чаевые Саше — каждый даёт отдельно, от души. В расчёт не входят.</div>';
 h+='<div class="tot"><span>Собрать всего</span><span class="num">'+fmt(c.collected)+'<em>грн.</em></span></div>';
 h+='<div class="bath"><span>'+c.n+' чел.'+(c.sOn?' + Саша (не платит)':'')+' · Бане: '+fmt(c.bath)+(c.sashaTip?' · Саше: '+fmt(c.sashaTip):'')+'</span></div>';
 h+='<div class="bath"><span>Аренда: '+formula(c)+'</span></div>';
 h+='<div class="btns"><button class="btn" data-act="copy">Копировать</button><button class="btn pri" data-act="share">Отправить в чат</button></div>';
 $('#result').innerHTML=h;updMain(c);
}
function renderAll(){renderControls();renderResult();renderPrices()}

function plain(list){return list.map(nm).join(', ')}
function text(){var c=calc(),d=new Date(),dd=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2),L=[];
 L.push('♨ Лазня '+dd+' — '+fh(c.H)+' ч, '+c.n+' чел.'+(c.sOn?' + Саша':''));
 L.push('Аренда: '+formula(c));
 if(c.broomsTotal)L.push('Веники: '+fmt(c.broomsTotal));
 if(c.staffTip)L.push('Чаевые бане: '+fmt(c.staffTip));
 L.push('');
 if(c.sOn&&c.steamers.length&&c.pool>0){
  L.push('🌿 Парились ('+plain(c.steamers)+'): по '+fmt(c.paySteam)+' грн');
  if(c.rest.length)L.push('Остальные ('+plain(c.rest)+'): по '+fmt(c.payRest)+' грн');
 }else L.push((c.sOn?'Все (пока без галочек): по ':'С каждого: ')+fmt(c.payRest)+' грн');
 if(c.sOn)L.push('Чаевые Саше — каждый отдельно, от души');
 L.push('','Собрать: '+fmt(c.collected)+' грн · бане: '+fmt(c.bath)+(c.sashaTip?' · Саше: '+fmt(c.sashaTip):''));
 return L.join('\n')}
function copy(){var t=text();
 function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();toast('Скопировано')}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Скопировано')},fb);else fb()}
function share(){var t=text();
 if(inTg){try{TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(t));return}catch(e){}}
 if(navigator.share){navigator.share({text:t}).catch(function(){});return}
 copy()}
function updMain(c){if(!inTg)return;try{TG.MainButton.setParams({text:c.sOn?'Отправить расчёт':'Отправить расчёт · по '+fmt(c.payRest)+' грн',color:'#d9711f',text_color:'#fff3df',is_visible:true})}catch(e){}}
function ask(msg,cb){if(inTg&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.2'))TG.showConfirm(msg,function(ok){if(ok)cb()});else if(window.confirm(msg))cb()}

/* ---------- события ---------- */
function bl(id){for(var i=0;i<state.bl.length;i++)if(state.bl[i].id===id)return state.bl[i];return {}}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,id=b.dataset.id;
 switch(a){
  case 'h+':state.hours=Math.min(12,state.hours+0.5);break;
  case 'h-':state.hours=Math.max(0.5,state.hours-0.5);break;
  case 'n+':state.count=Math.min(30,state.count+1);break;
  case 'n-':state.count=Math.max(1,state.count-1);break;
  case 'sasha':state.sasha.on=!state.sasha.on;break;
  case 'steam':var i=+b.dataset.i;state.steamed[i]=!state.steamed[i];break;
  case 'bq+':bl(id).q=(bl(id).q||0)+1;break;
  case 'bq-':bl(id).q=Math.max(0,(bl(id).q||0)-1);break;
  case 'badd':state.bl.push({id:uid(),q:0,p:0});break;
  case 'bdel':state.bl=state.bl.filter(function(x){return x.id!==id});break;
  case 'copy':copy();return;
  case 'share':share();return;
  case 'resetprices':state.prices=defaults().prices;save();renderAll();toast('Цены из прайса');return;
  case 'newsession':ask('Начать новый сеанс? Галочки «парил», веники и чаевые сбросятся. Имена и число участников останутся.',function(){
   state.steamed=[];state.bl.forEach(function(x){x.q=0});state.tip=0;state.sasha.tip=0;save();renderAll();window.scrollTo(0,0)});return;
  default:return;
 }
 hap();save();renderControls();renderResult();
});
document.addEventListener('keydown',function(e){if(e.key!=='Enter'||!e.target.dataset||e.target.dataset.name===undefined)return;
 e.preventDefault();var nx=document.querySelector('[data-name="'+(+e.target.dataset.name+1)+'"]');if(nx)nx.focus();else e.target.blur()});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.name!==undefined){state.names[+t.dataset.name]=t.value;save();renderResult();return}
 var v=Math.max(0,+t.value||0);
 if(t.dataset.bp){bl(t.dataset.bp).p=v}
 else if(t.id==='tipAmt'){state.tip=v}
 else if(t.id==='sashaTip'){state.sasha.tip=v}
 else if(t.dataset.cfg){state.prices[t.dataset.cfg]=t.dataset.cfg==='baseMax'?Math.max(1,Math.round(v)):v}
 else return;
 save();renderResult()});

if(inTg){try{TG.ready();TG.expand();TG.setHeaderColor('#1a0e06');TG.setBackgroundColor('#120a05');TG.MainButton.onClick(share)}catch(e){}}
load(function(){renderAll()});
})();
</script>
</body>
